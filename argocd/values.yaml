changedetection-io:
  ingress:
    main:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: changedetection.cluster.zack.klodnicki.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: changedetection.cluster.zack.klodnicki.com-tls
          hosts:
            - changedetection.cluster.zack.klodnicki.com
  persistence:
    data:
      enabled: true
      type: pvc
      mountPath: /datastore
      retain: true
      # Requested size for the PVC (used for dynamic provisioning)
      size: 1Gi
      accessMode: ReadWriteOnce
      # Optional: specify storageClassName if your cluster requires it
      # storageClassName: "standard"
  # Enable the browser sidecar for Javascript rendering (browserless)
  browserless:
    enabled: true
    image:
      repository: browserless/chrome
      tag: latest
      pullPolicy: Always
    env:
      ENABLE_DEBUGGER: "false"
      DEFAULT_BLOCK_ADS: "true"
      DEFAULT_STEALTH: "true"
  env:
    TZ: UTC
    # Point changedetection main container to the browser sidecar's Playwright websocket endpoint
    PLAYWRIGHT_DRIVER_URL: ws://localhost:3000
