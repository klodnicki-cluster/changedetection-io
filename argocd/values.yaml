changedetection-io:
  ingress:
    main:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: changedetection.cluster.zack.klodnicki.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: changedetection.cluster.zack.klodnicki.com-tls
          hosts:
            - changedetection.cluster.zack.klodnicki.com
  persistence:
    data:
      enabled: true
      type: hostPath
      hostPath:
        path: /var/lib/changedetection/data
        hostPathType: DirectoryOrCreate
      mountPath: /datastore
      retain: true
      # size/accessMode/storageClass are ignored for hostPath but may be set if switching to PVC later
      size: 1Gi
  env:
    TZ: UTC
